name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest ruff mypy
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: mypy --strict scripts tests
      - run: pytest -q
      - run: python -m json.tool .claude-plugin/plugin.json > /dev/null
      - run: python -m json.tool hooks/hooks.json > /dev/null
      - run: python -m json.tool skills/pm/templates/settings.example.json > /dev/null

  # Single stable check name for a branch ruleset.
  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
